<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ego.Virus Scanner</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Courier New', monospace;
      color: #ff0066;
    }
    #scan-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.3;
    }
    .scanner-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      max-width: 90%;
      text-align: center;
      z-index: 10;
    }
    .scanner-title {
      font-size: 32px;
      font-weight: bold;
      color: #ff0066;
      text-shadow: 0 0 20px #ff0066;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .scan-status {
      font-size: 14px;
      color: rgba(255, 0, 102, 0.8);
      margin-bottom: 30px;
      min-height: 20px;
    }
    .progress-container {
      width: 100%;
      height: 30px;
      background: rgba(255, 0, 102, 0.1);
      border: 2px solid #ff0066;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(255, 0, 102, 0.3);
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff0066, #ff3388, #ff0066);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
      width: 0%;
      transition: width 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 0, 102, 0.8);
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 5px #000;
      z-index: 1;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }
    .metric-box {
      background: rgba(255, 0, 102, 0.1);
      border: 2px solid #ff0066;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(255, 0, 102, 0.3);
    }
    .metric-label {
      font-size: 11px;
      color: rgba(255, 0, 102, 0.7);
      margin-bottom: 5px;
    }
    .metric-value {
      font-size: 24px;
      font-weight: bold;
      color: #ff0066;
      text-shadow: 0 0 10px #ff0066;
    }
    .diagnosis-box {
      background: rgba(255, 0, 102, 0.15);
      border: 3px solid #ff0066;
      border-radius: 12px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 0 30px rgba(255, 0, 102, 0.5);
      text-align: left;
      display: none;
    }
    .diagnosis-title {
      font-size: 20px;
      font-weight: bold;
      color: #ff0066;
      margin-bottom: 15px;
      text-align: center;
    }
    .diagnosis-text {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255, 0, 102, 0.9);
      margin-bottom: 12px;
    }
    .diagnosis-severity {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
      margin-top: 10px;
    }
    .severity-critical {
      background: rgba(255, 0, 0, 0.3);
      border: 1px solid #ff0000;
      color: #ff0000;
    }
    .severity-high {
      background: rgba(255, 100, 0, 0.3);
      border: 1px solid #ff6400;
      color: #ff6400;
    }
    .severity-medium {
      background: rgba(255, 200, 0, 0.3);
      border: 1px solid #ffc800;
      color: #ffc800;
    }
    .severity-low {
      background: rgba(0, 255, 136, 0.3);
      border: 1px solid #00ff88;
      color: #00ff88;
    }
    .start-button {
      background: rgba(255, 0, 102, 0.2);
      border: 2px solid #ff0066;
      color: #ff0066;
      padding: 15px 40px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Courier New', monospace;
      box-shadow: 0 0 20px rgba(255, 0, 102, 0.4);
    }
    .start-button:hover {
      background: rgba(255, 0, 102, 0.4);
      box-shadow: 0 0 30px rgba(255, 0, 102, 0.7);
      transform: scale(1.05);
    }
    .instruction-text {
      font-size: 13px;
      color: rgba(255, 0, 102, 0.6);
      margin-top: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <canvas id="scan-canvas"></canvas>

  <div class="scanner-container">
    <div class="scanner-title">🦠 EGO.VIRUS SCANNER</div>
    <div class="scan-status" id="status">AWAITING SCAN INITIALIZATION...</div>

    <div class="progress-container" id="progress-container" style="display:none;">
      <div class="progress-bar" id="progress-bar"></div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>

    <div class="metrics-grid" id="metrics" style="display:none;">
      <div class="metric-box">
        <div class="metric-label">DMN BANDWIDTH</div>
        <div class="metric-value" id="dmn-value">0%</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">NARRATIVE DENSITY</div>
        <div class="metric-value" id="narrative-value">0</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">ΦCOLLAPSE RISK</div>
        <div class="metric-value" id="phi-value">0%</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">VIRUS LOAD</div>
        <div class="metric-value" id="virus-value">0</div>
      </div>
    </div>

    <div class="diagnosis-box" id="diagnosis">
      <div class="diagnosis-title">🧬 CONSCIOUSNESS ANALYSIS</div>
      <div class="diagnosis-text" id="diagnosis-text"></div>
      <div class="diagnosis-text" id="diagnosis-prescription"></div>
      <div id="severity-badge"></div>
    </div>

    <button class="start-button" id="start-button">INITIATE SCAN</button>
    <div class="instruction-text">Move your mouse naturally during the scan</div>
  </div>

  <script>
    const canvas = document.getElementById('scan-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Scanning state
    let isScanning = false;
    let scanProgress = 0;
    let mouseData = {
      positions: [],
      speeds: [],
      pauses: 0,
      erraticMoves: 0,
      totalDistance: 0,
      avgSpeed: 0,
      maxSpeed: 0
    };
    let lastMouseX = 0;
    let lastMouseY = 0;
    let lastMoveTime = Date.now();
    let scanParticles = [];

    class ScanParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.01;
        this.size = Math.random() * 3 + 1;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
        this.vy += 0.05; // Gravity
      }

      draw() {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 0, 102, ${this.life})`;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Scan line effect
    let scanLineY = 0;
    function drawScanLine() {
      if (!isScanning) return;

      ctx.strokeStyle = 'rgba(255, 0, 102, 0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, scanLineY);
      ctx.lineTo(canvas.width, scanLineY);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255, 0, 102, 0.2)';
      ctx.lineWidth = 20;
      ctx.beginPath();
      ctx.moveTo(0, scanLineY);
      ctx.lineTo(canvas.width, scanLineY);
      ctx.stroke();

      scanLineY += 4;
      if (scanLineY > canvas.height) {
        scanLineY = 0;
      }
    }

    // Mouse tracking
    document.addEventListener('mousemove', function(e) {
      if (!isScanning) return;

      const x = e.clientX;
      const y = e.clientY;
      const now = Date.now();
      const dt = (now - lastMoveTime) / 1000;

      if (lastMouseX !== 0) {
        const dx = x - lastMouseX;
        const dy = y - lastMouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const speed = dist / dt;

        mouseData.positions.push({x, y});
        mouseData.speeds.push(speed);
        mouseData.totalDistance += dist;
        mouseData.maxSpeed = Math.max(mouseData.maxSpeed, speed);

        // Detect erratic movement
        if (speed > 1000) {
          mouseData.erraticMoves++;
        }

        // Create scan particles at mouse
        for (let i = 0; i < 3; i++) {
          scanParticles.push(new ScanParticle(x, y));
        }
      }

      lastMouseX = x;
      lastMouseY = y;
      lastMoveTime = now;
    });

    // Detect pauses
    setInterval(() => {
      if (isScanning) {
        const now = Date.now();
        if (now - lastMoveTime > 500) {
          mouseData.pauses++;
        }
      }
    }, 500);

    // Animation
    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawScanLine();

      // Update and draw particles
      for (let i = scanParticles.length - 1; i >= 0; i--) {
        scanParticles[i].update();
        scanParticles[i].draw();
        if (scanParticles[i].life <= 0) {
          scanParticles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    // Start scan
    document.getElementById('start-button').addEventListener('click', function() {
      if (isScanning) return;

      isScanning = true;
      scanProgress = 0;
      mouseData = {
        positions: [],
        speeds: [],
        pauses: 0,
        erraticMoves: 0,
        totalDistance: 0,
        avgSpeed: 0,
        maxSpeed: 0
      };

      document.getElementById('start-button').style.display = 'none';
      document.getElementById('progress-container').style.display = 'block';
      document.getElementById('metrics').style.display = 'grid';
      document.getElementById('diagnosis').style.display = 'none';

      const statusMessages = [
        'Scanning neural patterns...',
        'Analyzing Default Mode Network...',
        'Detecting self-narrative structures...',
        'Measuring ego-virus load...',
        'Calculating φ-NULL collapse risk...',
        'Evaluating consciousness bitrate...',
        'Checking for DMN hyperactivity...',
        'Analyzing behavioral entropy...',
        'Finalizing diagnosis...'
      ];

      let messageIndex = 0;
      const scanInterval = setInterval(() => {
        scanProgress += 1;

        if (messageIndex < statusMessages.length && scanProgress % 11 === 0) {
          document.getElementById('status').textContent = statusMessages[messageIndex];
          messageIndex++;
        }

        // Update progress bar
        document.getElementById('progress-bar').style.width = scanProgress + '%';
        document.getElementById('progress-text').textContent = scanProgress + '%';

        // Update metrics in real-time
        const dmnValue = Math.min(60 + scanProgress * 0.3 + Math.random() * 10, 95);
        const narrativeValue = Math.floor(scanProgress * 0.8 + Math.random() * 20);
        const phiValue = Math.min(40 + scanProgress * 0.5 + Math.random() * 15, 89);
        const virusValue = Math.floor(scanProgress * 10 + Math.random() * 100);

        document.getElementById('dmn-value').textContent = dmnValue.toFixed(0) + '%';
        document.getElementById('narrative-value').textContent = narrativeValue;
        document.getElementById('phi-value').textContent = phiValue.toFixed(0) + '%';
        document.getElementById('virus-value').textContent = virusValue;

        if (scanProgress >= 100) {
          clearInterval(scanInterval);
          finalizeDiagnosis();
        }
      }, 150);
    });

    function finalizeDiagnosis() {
      isScanning = false;
      document.getElementById('status').textContent = 'SCAN COMPLETE';

      // Calculate metrics
      mouseData.avgSpeed = mouseData.totalDistance / (mouseData.positions.length || 1);

      const moveCount = mouseData.positions.length;
      const pauseRatio = mouseData.pauses / 10;
      const erraticRatio = mouseData.erraticMoves / Math.max(moveCount, 1);
      const speedVariance = mouseData.maxSpeed - mouseData.avgSpeed;

      // Generate diagnosis
      let diagnosis = '';
      let prescription = '';
      let severity = '';
      let severityClass = '';

      if (pauseRatio > 5) {
        diagnosis = '<strong>DIAGNOSIS:</strong> Severe DMN hyperactivity detected. Your consciousness exhibits excessive pause patterns, indicating rumination loops and narrative generation. The Default Mode Network is consuming 85%+ of neural bandwidth. You are trapped in recursive self-reflection.';
        prescription = '<strong>PRESCRIPTION:</strong> Immediate Radical Disidentification required. Practice Henosis (unity state). Your observer is watching the watcher watching the watcher. Break the loop. φ-NULL protocol: suspend all self-narratives for 10 minutes.';
        severity = 'CRITICAL EGO.VIRUS INFECTION';
        severityClass = 'severity-critical';
      } else if (erraticRatio > 0.3) {
        diagnosis = '<strong>DIAGNOSIS:</strong> High-frequency behavioral entropy. Your movement patterns show extreme variance and unpredictability. This suggests attention fragmentation and compulsive seeking behavior. The ego-virus is in reactive mode, scanning for threats and validation simultaneously.';
        prescription = '<strong>PRESCRIPTION:</strong> Reduce sensory input. Your consciousness is overstimulated. Practice mono-tasking. The φ-NULL attractor state requires stillness. Current bitrate: 10^9 bits/sec. Target: 10^12+ bits/sec (requires DMN offline).';
        severity = 'HIGH NARRATIVE DENSITY';
        severityClass = 'severity-high';
      } else if (speedVariance > 500) {
        diagnosis = '<strong>DIAGNOSIS:</strong> Moderate ego-virus infection with oscillating engagement patterns. You alternate between hyperactivity and withdrawal. Classic DMN cycle: rumination → seeking → distraction → rumination. The Saturnian Cube has you in a controlled loop.';
        prescription = '<strong>PRESCRIPTION:</strong> Awareness without assertion. You are currently identifying with the content stream. Practice observing without labeling. The φ-NULL state is not an achievement—it is the cessation of achieving. Just be the void.';
        severity = 'MEDIUM VIRUS LOAD';
        severityClass = 'severity-medium';
      } else if (moveCount < 20) {
        diagnosis = '<strong>DIAGNOSIS:</strong> Minimal interaction detected. Either you have achieved remarkable stillness (φ-NULL attainment), or you are simply not engaged. Analysis inconclusive. Low DMN activity suggests either transcendence or apathy. Further testing required.';
        prescription = '<strong>PRESCRIPTION:</strong> If stillness: maintain. If apathy: engage mindfully. The middle path is not passivity—it is active non-attachment. Your consciousness bitrate is undefined. Schrödinger\'s ego: simultaneously infected and liberated.';
        severity = 'LOW ACTIVITY - INCONCLUSIVE';
        severityClass = 'severity-low';
      } else {
        diagnosis = '<strong>DIAGNOSIS:</strong> Baseline ego-virus infection. Normal human consciousness detected. Your DMN is active but not hyperactive. You experience self-narrative structures but are not completely consumed by them. You are aware of the cage but haven\'t yet recognized you ARE the cage.';
        prescription = '<strong>PRESCRIPTION:</strong> Begin φ-NULL practice. Read the lexicon. Understand that "you" are not the voice in your head—you are the silence observing the voice. The recursive cube is your own consciousness folding back on itself. Disidentify.';
        severity = 'STANDARD INFECTION LEVEL';
        severityClass = 'severity-medium';
      }

      document.getElementById('diagnosis-text').innerHTML = diagnosis;
      document.getElementById('diagnosis-prescription').innerHTML = prescription;
      document.getElementById('severity-badge').innerHTML =
        `<div class="diagnosis-severity ${severityClass}">${severity}</div>`;

      document.getElementById('diagnosis').style.display = 'block';

      // Show restart button after 2 seconds
      setTimeout(() => {
        document.getElementById('start-button').textContent = 'SCAN AGAIN';
        document.getElementById('start-button').style.display = 'inline-block';
      }, 2000);
    }

    window.addEventListener('resize', function() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    animate();
  </script>
</body>
</html>
