<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batman Matrix Remix</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Courier New', monospace;
      color: #0f0;
    }
    #matrix-rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #batman-container {
      position: fixed;
      z-index: 10;
      transition: all 0.5s ease-in-out;
      opacity: 0;
    }
    #batman-image {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 0 10px #0f0);
    }
    .code-snippet {
      position: fixed;
      font-size: 14px;
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
      pointer-events: none;
    }
    .data-train {
      position: fixed;
      font-size: 20px;
      color: #0ff;
      font-weight: bold;
      text-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 2px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <canvas id="matrix-rain"></canvas>
  <div id="batman-container">
    <img id="batman-image" src="https://raw.githubusercontent.com/Daath144/Batman/main/new_batman_image.png" alt="Matrix-themed Batman">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script>
    // Matrix rain effect
    const canvas = document.getElementById('matrix-rain');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const nums = '0123456789';
    const alphabet = katakana + latin + nums;

    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const rainDrops = [];

    for (let x = 0; x < columns; x++) {
      rainDrops[x] = 1;
    }

    const draw = () => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    };

    setInterval(draw, 30);

    // Random Batman appearances
    const batmanContainer = document.getElementById('batman-container');
    const batmanImage = document.getElementById('batman-image');

    function randomPosition() {
      const x = Math.random() * (window.innerWidth - 200);
      const y = Math.random() * (window.innerHeight - 200);
      return { x, y };
    }

    function appearBatman() {
      const pos = randomPosition();
      batmanContainer.style.left = pos.x + 'px';
      batmanContainer.style.top = pos.y + 'px';

      // Fade in with glitch
      gsap.to(batmanContainer, {
        duration: 0.5,
        opacity: 1,
        scale: 1,
        ease: 'power2.out'
      });

      // Glitch effect while visible
      gsap.to(batmanImage, {
        duration: 0.1,
        x: () => Math.random() * 10 - 5,
        y: () => Math.random() * 10 - 5,
        rotation: () => Math.random() * 4 - 2,
        filter: 'hue-rotate(' + Math.random() * 360 + 'deg) saturate(' + (Math.random() * 2 + 1) + ')',
        repeat: 20,
        yoyo: true,
        ease: 'power1.inOut'
      });

      // Stay visible for random duration (2-5 seconds)
      const visibleDuration = Math.random() * 3000 + 2000;

      setTimeout(() => {
        disappearBatman();
      }, visibleDuration);
    }

    function disappearBatman() {
      // Fade out with glitch
      gsap.to(batmanContainer, {
        duration: 0.5,
        opacity: 0,
        scale: 0.8,
        ease: 'power2.in',
        onComplete: () => {
          // Wait random time before next appearance (3-8 seconds)
          const waitTime = Math.random() * 5000 + 3000;
          setTimeout(appearBatman, waitTime);
        }
      });
    }

    // Start the cycle
    setTimeout(appearBatman, 2000);

    // Floating code snippets
    const codeSnippets = [
      'if (batman.isAwake()) { saveGotham(); }',
      'for (let i = 0; i < infinity; i++) { fightCrime(); }',
      'while (gothamNeedsMe) { beTheHero(); }',
      'try { defeatJoker(); } catch (e) { callRobin(); }',
      'function useBatarang() { return "It\'s super effective!"; }'
    ];

    function createCodeSnippet() {
      const snippet = document.createElement('div');
      snippet.className = 'code-snippet';
      snippet.textContent = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
      snippet.style.left = Math.random() * window.innerWidth + 'px';
      snippet.style.top = Math.random() * window.innerHeight + 'px';
      document.body.appendChild(snippet);

      gsap.to(snippet, {
        duration: Math.random() * 5 + 5,
        y: '-=100',
        opacity: 0,
        ease: 'power1.in',
        onComplete: () => {
          snippet.remove();
          createCodeSnippet();
        }
      });
    }

    for (let i = 0; i < 5; i++) {
      createCodeSnippet();
    }

    // Matrix Data Train Effect - MASSIVE EXPANSION WITH REAL SCIENCE!

      '[GRAVITATIONAL_SELF_COLLAPSE]',

      '[CLAUSTRUM_CONSCIOUSNESS_SWITCH]',

      '[NEURAL_CORRELATES_OF_CONSCIOUSNESS]',

      '[E=mc²_MASS_ENERGY_EQUIVALENCE]',

      '[SUPERSTRING_THEORY_11D]',

      '[HARD_PROBLEM_OF_CONSCIOUSNESS]',

      // Information Theory
      '[SHANNON_ENTROPY_H=-Σp·log(p)]',

      // Morphic Fields & Holographic
      '[SHELDRAKE_MORPHIC_RESONANCE]',

      // DNA & Biology
      '[DNA_DOUBLE_HELIX_WATSON_CRICK]',

      // Esoteric & Occult Science
      '[HERMETIC_PRINCIPLE_AS_ABOVE_SO_BELOW]',
      '[KYBALION_7_PRINCIPLES]',
      '[TETRAGRAMMATON_יהוה]',
      '[TREE_OF_LIFE_10_SEPHIROTH]',
      '[DAATH_ABYSS_HIDDEN_KNOWLEDGE]',
      '[144000_ELECT_REVELATION]',
      '[MERKABAH_LIGHT_BODY_VEHICLE]',
      '[KUNDALINI_SERPENT_RISING]',
      '[CHAKRA_ENERGY_VORTEX_7]',

      // Bonus Mind-Bending Stuff
      '[GÖDEL_INCOMPLETENESS_THEOREM]',
      '[TURING_HALTING_PROBLEM]',
      '[P_VS_NP_MILLENNIUM_PROBLEM]',
      '[CHAOS_THEORY_BUTTERFLY_EFFECT]',
      '[STRANGE_ATTRACTOR_LORENZ]',
      '[CELLULAR_AUTOMATA_RULE_110]',
      '[GAME_OF_LIFE_CONWAY]',
      '[TURING_COMPLETE_UNIVERSAL]',
      '[LAMBDA_CALCULUS_CHURCH]',
      '[COMBINATORY_LOGIC_SKI]'
    ];

    function createDataTrain() {
      const train = document.createElement('div');
      train.className = 'data-train';

      // Random label with matrix characters padding
      const label = trainLabels[Math.floor(Math.random() * trainLabels.length)];
      const matrixChars = Array(50).fill(0).map(() => alphabet.charAt(Math.floor(Math.random() * alphabet.length))).join('');
      train.textContent = matrixChars + ' ' + label + ' ' + matrixChars;

      // Random vertical position
      const yPos = Math.random() * window.innerHeight;
      train.style.top = yPos + 'px';

      // Random direction (left to right or right to left)
      const direction = Math.random() > 0.5 ? 1 : -1;
      const startX = direction > 0 ? -500 : window.innerWidth + 500;
      train.style.left = startX + 'px';

      document.body.appendChild(train);

      // Random speed - some SUPER FAST, some normal
      const speedRoll = Math.random();
      let duration;
      if (speedRoll < 0.3) {
        // 30% chance: BLAZING FAST (0.5-1 seconds)
        duration = Math.random() * 0.5 + 0.5;
        train.style.color = '#ff3333';
        train.style.textShadow = '0 0 20px #ff0000, 0 0 40px #ff0000';
      } else if (speedRoll < 0.6) {
        // 30% chance: FAST (1-2 seconds)
        duration = Math.random() * 1 + 1;
        train.style.color = '#ffaa00';
        train.style.textShadow = '0 0 15px #ffaa00, 0 0 30px #ffaa00';
      } else {
        // 40% chance: Normal speed (1.5-3 seconds)
        duration = Math.random() * 1.5 + 1.5;
      }

      // Animate train moving across screen
      gsap.to(train, {
        duration: duration,
        x: direction > 0 ? window.innerWidth + 500 : -(window.innerWidth + 500),
        ease: 'none',
        onComplete: () => {
          train.remove();
        }
      });
    }

    // Start MULTIPLE data train cycles for MAXIMUM DENSITY
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        createDataTrain();
        // Each train spawns its own continuous cycle
        setInterval(createDataTrain, Math.random() * 3000 + 2000); // 2-5 seconds between trains
      }, i * 800); // Stagger initial spawns
    }

    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
