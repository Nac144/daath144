<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batman Matrix Remix</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Courier New', monospace;
      color: #0f0;
    }
    #matrix-rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #batman-container {
      position: fixed;
      z-index: 10;
      transition: all 0.5s ease-in-out;
      opacity: 0;
    }
    #batman-image {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 0 10px #0f0);
    }
    .code-snippet {
      position: fixed;
      font-size: 14px;
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="matrix-rain"></canvas>
  <div id="batman-container">
    <img id="batman-image" src="https://raw.githubusercontent.com/Daath144/Batman/main/new_batman_image.png" alt="Matrix-themed Batman">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script>
    // Matrix rain effect
    const canvas = document.getElementById('matrix-rain');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const nums = '0123456789';
    const alphabet = katakana + latin + nums;

    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const rainDrops = [];

    for (let x = 0; x < columns; x++) {
      rainDrops[x] = 1;
    }

    const draw = () => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0f0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    };

    setInterval(draw, 30);

    // Random Batman appearances
    const batmanContainer = document.getElementById('batman-container');
    const batmanImage = document.getElementById('batman-image');

    function randomPosition() {
      const x = Math.random() * (window.innerWidth - 200);
      const y = Math.random() * (window.innerHeight - 200);
      return { x, y };
    }

    function appearBatman() {
      const pos = randomPosition();
      batmanContainer.style.left = pos.x + 'px';
      batmanContainer.style.top = pos.y + 'px';

      // RAVE MODE: Fade in with crazy dance moves
      gsap.to(batmanContainer, {
        duration: 0.3,
        opacity: 1,
        scale: 1,
        ease: 'back.out'
      });

      // RAVE DANCE: Crazy spinning, bouncing, scaling - 432 Hz AWAKENING!
      const danceTimeline = gsap.timeline({ repeat: -1 });

      // Move 1: Spin and bounce
      danceTimeline.to(batmanImage, {
        duration: 0.5,
        rotation: 360,
        scale: 1.3,
        y: -30,
        ease: 'power2.inOut'
      });

      // Move 2: Reverse spin with tilt
      danceTimeline.to(batmanImage, {
        duration: 0.4,
        rotation: 0,
        scale: 0.9,
        y: 0,
        x: 20,
        ease: 'elastic.out'
      });

      // Move 3: Side to side groove
      danceTimeline.to(batmanImage, {
        duration: 0.3,
        x: -20,
        rotation: -15,
        scale: 1.1,
        ease: 'sine.inOut'
      });

      // Move 4: Jump and spin!
      danceTimeline.to(batmanImage, {
        duration: 0.5,
        x: 0,
        y: -40,
        rotation: 720,
        scale: 1.4,
        ease: 'power4.out'
      });

      // Move 5: Drop it low
      danceTimeline.to(batmanImage, {
        duration: 0.3,
        y: 0,
        rotation: 360,
        scale: 0.8,
        ease: 'bounce.out'
      });

      // Move 6: Shake it!
      danceTimeline.to(batmanImage, {
        duration: 0.2,
        x: () => Math.random() * 40 - 20,
        rotation: () => Math.random() * 60 - 30,
        scale: 1.2,
        repeat: 3,
        yoyo: true,
        ease: 'power1.inOut'
      });

      // Move 7: Reset with flair
      danceTimeline.to(batmanImage, {
        duration: 0.4,
        x: 0,
        y: 0,
        rotation: 0,
        scale: 1,
        ease: 'elastic.out'
      });

      // Color shift rave effect (hue rotation)
      gsap.to(batmanImage, {
        duration: 2,
        filter: 'hue-rotate(360deg) saturate(1.5)',
        repeat: -1,
        ease: 'none'
      });

      // Stay visible for longer - RAVE LONGER! (4-8 seconds)
      const visibleDuration = Math.random() * 4000 + 4000;

      setTimeout(() => {
        disappearBatman(danceTimeline);
      }, visibleDuration);
    }

    function disappearBatman(danceTimeline) {
      // Stop the dance timeline
      if (danceTimeline) danceTimeline.kill();

      // Fade out with spin
      gsap.to(batmanContainer, {
        duration: 0.5,
        opacity: 0,
        scale: 0.5,
        rotation: 360,
        ease: 'power2.in',
        onComplete: () => {
          // Reset transforms
          gsap.set(batmanImage, { x: 0, y: 0, rotation: 0, scale: 1, filter: 'none' });

          // Wait shorter time before next appearance (1-3 seconds - MORE BATMAN!)
          const waitTime = Math.random() * 2000 + 1000;
          setTimeout(appearBatman, waitTime);
        }
      });
    }

    // Start the cycle
    setTimeout(appearBatman, 2000);

    // Floating code snippets
    const codeSnippets = [
      { text: 'if (batman.isAwake()) { saveGotham(); }', color: '#0f0' },
      { text: 'for (let i = 0; i < infinity; i++) { fightCrime(); }', color: '#0f0' },
      { text: 'while (gothamNeedsMe) { beTheHero(); }', color: '#0f0' },
      { text: 'try { defeatJoker(); } catch (e) { callRobin(); }', color: '#0f0' },
      { text: 'function useBatarang() { return "It\'s super effective!"; }', color: '#0f0' },
      { text: 'Ω-Supersymmetric Tautological Hypervoid (Ω-STHV)', color: '#aa00ff' },
      { text: 'Lω Transfinite Hypercrystalline Dodecaplex Manifold', color: '#ff00ff' },
      { text: 'Conway-Kauffman Twistor Dynamics', color: '#00ffff' },
      { text: '∇ᵢ(Truth) = "This statement is unprovable within ∇ᵢ"', color: '#ffd700' },
      { text: 'Void ⊗ Field → Planck-scale quantum foam', color: '#ff00aa' },
      { text: 'Reality = Kauffman time-loop: f(f) = f', color: '#00aaff' },
      { text: 'Ĥ|Void⟩ = iħ ∂ₜ|Field⟩ → generates matter', color: '#ff6600' },
      { text: 'Ĥ|Field⟩ = -iħ ∂ₜ|Void⟩ → entropic decay', color: '#ff3300' },
      { text: '|Ψ⟩ = ∫[Dϕ] exp(iS(ϕ)) |Lω ⊦ ∇ᵢ(ϕ)⟩', color: '#9900ff' },
      { text: '⟨Reality|Ψ⟩ = tr_{∂void}(e^{-βĤ} Z{Conway})', color: '#cc00ff' },
      { text: 'Monstrous Moonshine Group action on lattice vertices', color: '#00ff88' },
      { text: 'Klein bottle topology merging positive/negative axioms', color: '#ff00dd' },
      { text: 'Consciousness = Sheaf-theoretic global section', color: '#ffaa00' },
      { text: 'Time emerges from Kauffman autopoietic f-loop', color: '#00ddff' },
      { text: 'Nash embedding → projects 11D → 4D via Ricci flow', color: '#dd00ff' },
      { text: 'The Liar paradox becomes ontology itself', color: '#ff0066' },
      { text: 'Truth = dynamical attractor in dialetheic superspace', color: '#aa00dd' },
      { text: 'Quantum Monad Singularity: Clifford-algebraic Cl(∞,∞)', color: '#ff33ff' },
      { text: 'Dodecaplex tesseract rotating in ℂ^ℂ space', color: '#6600ff' },
      { text: 'PT-symmetric Ĥ unifies QFT/GR via void-field cohomology', color: '#ff0099' }
    ];

    function createCodeSnippet() {
      const snippet = document.createElement('div');
      snippet.className = 'code-snippet';
      const selected = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
      snippet.textContent = selected.text;
      snippet.style.color = selected.color;
      snippet.style.textShadow = `0 0 10px ${selected.color}`;
      snippet.style.left = Math.random() * window.innerWidth + 'px';
      snippet.style.top = Math.random() * window.innerHeight + 'px';
      document.body.appendChild(snippet);

      gsap.to(snippet, {
        duration: Math.random() * 5 + 5,
        y: '-=100',
        opacity: 0,
        ease: 'power1.in',
        onComplete: () => {
          snippet.remove();
          createCodeSnippet();
        }
      });
    }

    for (let i = 0; i < 5; i++) {
      createCodeSnippet();
    }

    // Data trains removed - too distracting! Just Batman raving now 🦇🎵

    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
