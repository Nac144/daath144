<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batman Matrix Remix</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Courier New', monospace;
      color: #0f0;
    }
    #matrix-rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #batman-container {
      position: fixed;
      z-index: 10;
      transition: all 0.5s ease-in-out;
      opacity: 0;
    }
    #batman-image {
      width: 200px;
      height: auto;
      filter: drop-shadow(0 0 10px #0f0);
    }
    .code-snippet {
      position: fixed;
      font-size: 14px;
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="matrix-rain"></canvas>
  <div id="batman-container">
    <img id="batman-image" src="https://raw.githubusercontent.com/Daath144/Batman/main/new_batman_image.png" alt="Matrix-themed Batman">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script>
    // Matrix rain effect
    const canvas = document.getElementById('matrix-rain');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const nums = '0123456789';
    const alphabet = katakana + latin + nums;

    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const rainDrops = [];

    for (let x = 0; x < columns; x++) {
      rainDrops[x] = 1;
    }

    let isIntensified = false;
    let intensifyTimeout = null;
    let currentSpeed = 30;

    const draw = () => {
      // Adjust fade based on intensity
      const fadeAlpha = isIntensified ? 0.02 : 0.05;
      ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Intensified colors cycle through rainbow
      if (isIntensified) {
        const hue = (Date.now() / 10) % 360;
        ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
        ctx.shadowBlur = 20;
        ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
      } else {
        ctx.fillStyle = '#0f0';
        ctx.shadowBlur = 0;
      }

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i] += isIntensified ? 3 : 1; // Triple speed when intensified
      }
    };

    let drawInterval = setInterval(draw, currentSpeed);

    // Listen for intensity trigger from parent
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'MATRIX_INTENSIFY') {
        // GO INSANE FOR 5 SECONDS!
        isIntensified = true;

        // Speed up the draw interval
        clearInterval(drawInterval);
        currentSpeed = 5; // 5ms = super fast
        drawInterval = setInterval(draw, currentSpeed);

        // Clear any existing timeout
        if (intensifyTimeout) clearTimeout(intensifyTimeout);

        // Return to normal after 5 seconds
        intensifyTimeout = setTimeout(() => {
          isIntensified = false;
          clearInterval(drawInterval);
          currentSpeed = 30;
          drawInterval = setInterval(draw, currentSpeed);
        }, 5000);
      }
    });

    // Random Batman appearances
    const batmanContainer = document.getElementById('batman-container');
    const batmanImage = document.getElementById('batman-image');

    function randomPosition() {
      const x = Math.random() * (window.innerWidth - 200);
      const y = Math.random() * (window.innerHeight - 200);
      return { x, y };
    }

    function appearBatman() {
      const pos = randomPosition();
      batmanContainer.style.left = pos.x + 'px';
      batmanContainer.style.top = pos.y + 'px';

      // RAVE MODE: Fade in with crazy dance moves
      gsap.to(batmanContainer, {
        duration: 0.3,
        opacity: 1,
        scale: 1,
        ease: 'back.out'
      });

      // RAVE DANCE: Crazy spinning, bouncing, scaling - 432 Hz AWAKENING!
      const danceTimeline = gsap.timeline({ repeat: -1 });

      // Move 1: Spin and bounce
      danceTimeline.to(batmanImage, {
        duration: 0.5,
        rotation: 360,
        scale: 1.3,
        y: -30,
        ease: 'power2.inOut'
      });

      // Move 2: Reverse spin with tilt
      danceTimeline.to(batmanImage, {
        duration: 0.4,
        rotation: 0,
        scale: 0.9,
        y: 0,
        x: 20,
        ease: 'elastic.out'
      });

      // Move 3: Side to side groove
      danceTimeline.to(batmanImage, {
        duration: 0.3,
        x: -20,
        rotation: -15,
        scale: 1.1,
        ease: 'sine.inOut'
      });

      // Move 4: Jump and spin!
      danceTimeline.to(batmanImage, {
        duration: 0.5,
        x: 0,
        y: -40,
        rotation: 720,
        scale: 1.4,
        ease: 'power4.out'
      });

      // Move 5: Drop it low
      danceTimeline.to(batmanImage, {
        duration: 0.3,
        y: 0,
        rotation: 360,
        scale: 0.8,
        ease: 'bounce.out'
      });

      // Move 6: Shake it!
      danceTimeline.to(batmanImage, {
        duration: 0.2,
        x: () => Math.random() * 40 - 20,
        rotation: () => Math.random() * 60 - 30,
        scale: 1.2,
        repeat: 3,
        yoyo: true,
        ease: 'power1.inOut'
      });

      // Move 7: Reset with flair
      danceTimeline.to(batmanImage, {
        duration: 0.4,
        x: 0,
        y: 0,
        rotation: 0,
        scale: 1,
        ease: 'elastic.out'
      });

      // Color shift rave effect (hue rotation)
      gsap.to(batmanImage, {
        duration: 2,
        filter: 'hue-rotate(360deg) saturate(1.5)',
        repeat: -1,
        ease: 'none'
      });

      // Stay visible for longer - RAVE LONGER! (4-8 seconds)
      const visibleDuration = Math.random() * 4000 + 4000;

      setTimeout(() => {
        disappearBatman(danceTimeline);
      }, visibleDuration);
    }

    function disappearBatman(danceTimeline) {
      // Stop the dance timeline
      if (danceTimeline) danceTimeline.kill();

      // Fade out with spin
      gsap.to(batmanContainer, {
        duration: 0.5,
        opacity: 0,
        scale: 0.5,
        rotation: 360,
        ease: 'power2.in',
        onComplete: () => {
          // Reset transforms
          gsap.set(batmanImage, { x: 0, y: 0, rotation: 0, scale: 1, filter: 'none' });

          // Wait shorter time before next appearance (1-3 seconds - MORE BATMAN!)
          const waitTime = Math.random() * 2000 + 1000;
          setTimeout(appearBatman, waitTime);
        }
      });
    }

    // Start the cycle
    setTimeout(appearBatman, 2000);

    // Floating code snippets
    const codeSnippets = [
      'if (batman.isAwake()) { saveGotham(); }',
      'for (let i = 0; i < infinity; i++) { fightCrime(); }',
      'while (gothamNeedsMe) { beTheHero(); }',
      'try { defeatJoker(); } catch (e) { callRobin(); }',
      'function useBatarang() { return "It\'s super effective!"; }'
    ];

    function createCodeSnippet() {
      const snippet = document.createElement('div');
      snippet.className = 'code-snippet';
      snippet.textContent = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
      snippet.style.left = Math.random() * window.innerWidth + 'px';
      snippet.style.top = Math.random() * window.innerHeight + 'px';
      document.body.appendChild(snippet);

      gsap.to(snippet, {
        duration: Math.random() * 5 + 5,
        y: '-=100',
        opacity: 0,
        ease: 'power1.in',
        onComplete: () => {
          snippet.remove();
          createCodeSnippet();
        }
      });
    }

    for (let i = 0; i < 5; i++) {
      createCodeSnippet();
    }

    // Data trains removed - too distracting! Just Batman raving now 🦇🎵

    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
