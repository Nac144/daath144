<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesseract Operator {4,3,3}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'JetBrains Mono', monospace;
        }
        #tesseract-container {
            text-align: center;
        }
        canvas {
            border: 1px solid #333;
            background: #000;
        }
        .controls {
            margin-top: 20px;
            color: #05d9e8;
        }
        h1 {
            color: #ff2a6d;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="tesseract-container">
        <h1>THE TESSERACT OPERATOR {4,3,3}</h1>
        <canvas id="tesseract" width="600" height="600"></canvas>
        <div class="controls">
            <p>4D → 3D Stereographic Projection | The Collapse Mechanism</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('tesseract');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const centerX = width / 2;
        const centerY = height / 2;

        // === THE TESSERACT CONSTRUCT {4,3,3} ===
        // 16 vertices of 4D hypercube
        function makeTesseract() {
            const vertices = [];
            for (let x of [-1, 1]) {
                for (let y of [-1, 1]) {
                    for (let z of [-1, 1]) {
                        for (let w of [-1, 1]) {
                            vertices.push([x, y, z, w]);
                        }
                    }
                }
            }
            return vertices;
        }

        // === EDGES (32 edges connecting vertices that differ by 1 coordinate) ===
        function makeEdges() {
            const edges = [];
            const vertices = makeTesseract();
            for (let i = 0; i < 16; i++) {
                for (let j = i + 1; j < 16; j++) {
                    let diff = 0;
                    for (let k = 0; k < 4; k++) {
                        diff += Math.abs(vertices[i][k] - vertices[j][k]);
                    }
                    if (diff === 2) { // Exactly one coordinate differs
                        edges.push([i, j]);
                    }
                }
            }
            return edges;
        }

        // === 4D ROTATION MATRICES ===
        function rotateXW(v, angle) {
            const c = Math.cos(angle);
            const s = Math.sin(angle);
            return [
                c * v[0] - s * v[3],
                v[1],
                v[2],
                s * v[0] + c * v[3]
            ];
        }

        function rotateYW(v, angle) {
            const c = Math.cos(angle);
            const s = Math.sin(angle);
            return [
                v[0],
                c * v[1] - s * v[3],
                v[2],
                s * v[1] + c * v[3]
            ];
        }

        function rotateZW(v, angle) {
            const c = Math.cos(angle);
            const s = Math.sin(angle);
            return [
                v[0],
                v[1],
                c * v[2] - s * v[3],
                s * v[2] + c * v[3]
            ];
        }

        // === STEREOGRAPHIC PROJECTION (4D -> 3D) ===
        function project4Dto3D(vertices, angleXW, angleYW, angleZW) {
            const distance = 3;
            const projected = [];

            for (let v of vertices) {
                // Apply 4D rotations
                let rotated = rotateXW(v, angleXW);
                rotated = rotateYW(rotated, angleYW);
                rotated = rotateZW(rotated, angleZW);

                // Stereographic projection
                const w = rotated[3];
                const factor = 1 / (distance - w);

                projected.push([
                    rotated[0] * factor,
                    rotated[1] * factor,
                    rotated[2] * factor
                ]);
            }

            return projected;
        }

        // === SIMPLE 3D -> 2D PROJECTION ===
        function project3Dto2D(point3D, scale = 100) {
            const perspective = 4;
            const z = point3D[2];
            const factor = perspective / (perspective + z);

            return {
                x: centerX + point3D[0] * scale * factor,
                y: centerY - point3D[1] * scale * factor,
                z: z // Keep for depth sorting
            };
        }

        // === RENDERING ===
        const vertices = makeTesseract();
        const edges = makeEdges();
        let time = 0;

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);

            // Rotate through 4th dimension
            const angleXW = time * 0.3;
            const angleYW = time * 0.2;
            const angleZW = time * 0.1;

            const projected3D = project4Dto3D(vertices, angleXW, angleYW, angleZW);
            const projected2D = projected3D.map(p => project3Dto2D(p));

            // Draw edges
            ctx.strokeStyle = '#05d9e8';
            ctx.lineWidth = 2;
            edges.forEach(([i, j]) => {
                const p1 = projected2D[i];
                const p2 = projected2D[j];

                // Depth-based alpha
                const avgZ = (p1.z + p2.z) / 2;
                const alpha = Math.max(0.3, Math.min(1, (avgZ + 2) / 4));

                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
            });

            // Draw vertices
            ctx.globalAlpha = 1;
            projected2D.forEach((p, i) => {
                const size = 4 + (p.z + 2) * 2; // Size based on depth
                ctx.fillStyle = '#ff2a6d';
                ctx.beginPath();
                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                ctx.fill();

                // Subtle glow
                ctx.fillStyle = 'rgba(255, 42, 109, 0.3)';
                ctx.beginPath();
                ctx.arc(p.x, p.y, size * 2, 0, Math.PI * 2);
                ctx.fill();
            });

            time += 0.01;
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
