        // Populate grid
        function populateGrid(terms = lexicon) {
            const grid = document.getElementById('lexiconGrid');
            grid.innerHTML = terms.map(item => `
                <div class="term-card" data-category="${item.category}" onclick="toggleTerm(this)">
                    <div class="term-header">
                        <div>
                            <div class="term-name">${item.term}</div>
                            <div class="term-category">${item.category}</div>
                        </div>
                        <div class="expand-icon">▼</div>
                    </div>
                    <div class="term-preview">${item.preview}</div>
                    <div class="term-content">
                        <div class="term-definition">${item.definition}</div>
                        <div class="term-relations">
                            <h4>◈ SEMANTIC LINKS:</h4>
                            <div class="relation-links">
                                ${item.relations.map(rel => `
                                    <a class="relation-link" onclick="event.stopPropagation(); jumpToTerm('${rel}')">${rel}</a>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleTerm(card) {
            const wasExpanded = card.classList.contains('expanded');

            // Close all other cards
            document.querySelectorAll('.term-card').forEach(c => {
                c.classList.remove('expanded');
            });

            // Toggle clicked card
            if (!wasExpanded) {
                card.classList.add('expanded');
                // Use a less aggressive scroll that won't affect parent layout
                setTimeout(() => {
                    const rect = card.getBoundingClientRect();
                    const offset = window.pageYOffset + rect.top - 20;
                    window.scrollTo({ top: offset, behavior: 'smooth' });
                }, 50);
            }
        }

        function jumpToTerm(termName) {
            const allCards = document.querySelectorAll('.term-card');
            allCards.forEach(card => {
                const name = card.querySelector('.term-name').textContent;
                if (name === termName) {
                    card.classList.add('expanded');
                    setTimeout(() => {
                        const rect = card.getBoundingClientRect();
                        const offset = window.pageYOffset + rect.top - 20;
                        window.scrollTo({ top: offset, behavior: 'smooth' });
                    }, 100);
                } else {
                    card.classList.remove('expanded');
                }
            });
        }

        function filterCategory(category) {
            // Update active button
            document.querySelectorAll('.category-filter').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter cards
            const cards = document.querySelectorAll('.term-card');
            cards.forEach(card => {
                if (category === 'ALL' || card.dataset.category === category) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterTerms() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.term-card');

            cards.forEach(card => {
                const term = card.querySelector('.term-name').textContent.toLowerCase();
                const preview = card.querySelector('.term-preview').textContent.toLowerCase();
                const definition = card.querySelector('.term-definition').textContent.toLowerCase();

                if (term.includes(searchTerm) || preview.includes(searchTerm) || definition.includes(searchTerm)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Initialize
        populateGrid();

        // Mouse Trail Effect - Grey particle trail for iframe consistency
        (function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '9999';
            document.body.appendChild(canvas);

            let particles = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.size = Math.random() * 3 + 2;
                    this.speedX = (Math.random() - 0.5) * 2;
                    this.speedY = (Math.random() - 0.5) * 2;
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.01;

                    // Grey theme - choose between white and grey
                    const grey = Math.random() > 0.5 ? '255, 255, 255' : '150, 150, 150';
                    this.color = grey;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.life -= this.decay;
                    this.size *= 0.98;
                }

                draw() {
                    ctx.fillStyle = `rgba(${this.color}, ${this.life})`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = `rgba(${this.color}, ${this.life})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();

                    // Add a smaller bright core
                    ctx.shadowBlur = 5;
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.life * 0.8})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            document.addEventListener('mousemove', function(e) {
                // Create particles (throttle to every other frame for performance)
                if (Math.random() > 0.5) {
                    particles.push(new Particle(e.clientX, e.clientY));
                }
            });

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Update and draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();

                    // Remove dead particles
                    if (particles[i].life <= 0 || particles[i].size <= 0.1) {
                        particles.splice(i, 1);
                    }
                }

                // Limit particle count for performance
                if (particles.length > 150) {
                    particles.splice(0, particles.length - 150);
                }

                requestAnimationFrame(animate);
            }

            animate();
        })();
    </script>
