<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saturn King Matrix</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Courier New', monospace;
      color: #00ff88;
    }
    #matrix-rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #saturn-container {
      position: fixed;
      z-index: 10;
      transition: all 0.5s ease-in-out;
      opacity: 0;
    }
    #saturn-image {
      width: 250px;
      height: auto;
      filter: drop-shadow(0 0 12px #00ff88) drop-shadow(0 0 20px rgba(0, 255, 136, 0.6));
    }
    .code-snippet {
      position: fixed;
      font-size: 14px;
      color: #00ff88;
      text-shadow: 0 0 5px #00ff88;
      pointer-events: none;
    }
    #video-container {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      background: rgba(0, 0, 0, 0.85);
      padding: 20px;
      border-radius: 12px;
      border: 3px solid #00ff88;
      box-shadow:
        0 0 20px rgba(0, 255, 136, 0.5),
        0 0 40px rgba(0, 255, 136, 0.3),
        inset 0 0 30px rgba(0, 255, 136, 0.2);
    }
    #video-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #00ff88;
      text-shadow: 0 0 10px #00ff88;
      margin-bottom: 15px;
      letter-spacing: 2px;
    }
    #video-container iframe {
      display: block;
      border-radius: 8px;
      border: 2px solid rgba(0, 255, 136, 0.5);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
    }
    @media (max-width: 768px) {
      #video-container {
        width: 90%;
        padding: 15px;
      }
      #video-container iframe {
        width: 100% !important;
        height: auto;
        aspect-ratio: 16 / 9;
      }
    }
  </style>
</head>
<body>
  <canvas id="matrix-rain"></canvas>
  <div id="saturn-container">
    <img id="saturn-image" src="images/saturn%20king.png" alt="Saturn King">
  </div>

  <!-- Saturn Video -->
  <div id="video-container">
    <div id="video-title">♄ THE SATURN MATRIX ♄</div>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/cO3_SIsUeig" title="YouTube video player" frameborder="0" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script>
    // Matrix rain effect (gold/purple theme)
    const canvas = document.getElementById('matrix-rain');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
    const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const nums = '0123456789';
    const symbols = '☿♀♁♂♃♄♅♆φ∞◈⚡';
    const alphabet = katakana + latin + nums + symbols;

    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const rainDrops = [];

    for (let x = 0; x < columns; x++) {
      rainDrops[x] = 1;
    }

    const draw = () => {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Gradient green matrix theme
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#00ff88');
      gradient.addColorStop(0.5, '#00cc66');
      gradient.addColorStop(1, '#00aa44');
      ctx.fillStyle = gradient;

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    };

    setInterval(draw, 30);

    // Random Saturn King appearances
    const saturnContainer = document.getElementById('saturn-container');
    const saturnImage = document.getElementById('saturn-image');

    // Drag state management
    let isDragging = false;
    let isManuallyPlaced = false;
    let currentDanceTimeline = null;
    let currentHueShiftAnimation = null;
    let currentTimeouts = [];
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    function randomPosition() {
      // Avoid center area where video is (roughly center 40% of screen)
      const centerExclusionZone = {
        minX: window.innerWidth * 0.3,
        maxX: window.innerWidth * 0.7,
        minY: window.innerHeight * 0.3,
        maxY: window.innerHeight * 0.7
      };

      let x, y;
      let attempts = 0;

      do {
        x = Math.random() * (window.innerWidth - 250);
        y = Math.random() * (window.innerHeight - 250);
        attempts++;

        // If we've tried too many times, force to edges
        if (attempts > 50) {
          if (Math.random() > 0.5) {
            x = Math.random() > 0.5 ? Math.random() * centerExclusionZone.minX : centerExclusionZone.maxX + Math.random() * (window.innerWidth - centerExclusionZone.maxX - 250);
          } else {
            y = Math.random() > 0.5 ? Math.random() * centerExclusionZone.minY : centerExclusionZone.maxY + Math.random() * (window.innerHeight - centerExclusionZone.maxY - 250);
          }
          break;
        }
      } while (
        x > centerExclusionZone.minX && x < centerExclusionZone.maxX &&
        y > centerExclusionZone.minY && y < centerExclusionZone.maxY
      );

      return { x, y };
    }

    function appearSaturn() {
      // Don't appear if manually placed
      if (isManuallyPlaced) return;

      const pos = randomPosition();
      saturnContainer.style.left = pos.x + 'px';
      saturnContainer.style.top = pos.y + 'px';

      // SOVEREIGN MODE: Fade in with cosmic power
      gsap.to(saturnContainer, {
        duration: 0.4,
        opacity: 1,
        scale: 1,
        ease: 'back.out'
      });

      // SATURN SOVEREIGNTY: Ring orbits and sacred geometry
      currentDanceTimeline = gsap.timeline({ repeat: -1 });

      // Move 1: Orbital rise (like Saturn orbiting in space)
      currentDanceTimeline.to(saturnImage, {
        duration: 1.2,
        rotation: 360,
        scale: 1.3,
        ease: 'sine.inOut',
        motionPath: {
          path: [
            {x: 0, y: 0},
            {x: 60, y: -40},
            {x: 0, y: -60}
          ],
          curviness: 1.5
        }
      });

      // Move 2: Ring tilt and hexagon pattern (Saturnian cube geometry)
      currentDanceTimeline.to(saturnImage, {
        duration: 0.8,
        rotation: 60,
        scale: 1.4,
        ease: 'power2.inOut',
        motionPath: {
          path: [
            {x: 0, y: -60},
            {x: 52, y: -30},
            {x: 52, y: 30}
          ]
        }
      });

      // Move 3: Complete hexagon orbit
      currentDanceTimeline.to(saturnImage, {
        duration: 0.8,
        rotation: 120,
        motionPath: {
          path: [
            {x: 52, y: 30},
            {x: 0, y: 60},
            {x: -52, y: 30}
          ]
        },
        ease: 'power1.inOut'
      });

      // Move 4: Continue hexagon
      currentDanceTimeline.to(saturnImage, {
        duration: 0.8,
        rotation: 180,
        scale: 1.2,
        motionPath: {
          path: [
            {x: -52, y: 30},
            {x: -52, y: -30},
            {x: 0, y: -60}
          ]
        },
        ease: 'power1.inOut'
      });

      // Move 5: Ring wobble (Saturn's rings oscillating)
      currentDanceTimeline.to(saturnImage, {
        duration: 0.6,
        scaleX: 1.5,
        scaleY: 0.8,
        rotation: 270,
        x: 0,
        y: 0,
        ease: 'elastic.out(1, 0.5)'
      });

      // Move 6: Ring stabilize
      currentDanceTimeline.to(saturnImage, {
        duration: 0.5,
        scaleX: 1.2,
        scaleY: 1.2,
        rotation: 360,
        ease: 'back.out(1.4)'
      });

      // Move 7: Slow orbital spin (majestic)
      currentDanceTimeline.to(saturnImage, {
        duration: 1.5,
        rotation: 720,
        scale: 1.1,
        ease: 'none'
      });

      // Move 8: Reset to sovereign pose
      currentDanceTimeline.to(saturnImage, {
        duration: 0.7,
        x: 0,
        y: 0,
        rotation: 0,
        scale: 1,
        scaleX: 1,
        scaleY: 1,
        ease: 'power2.out'
      });

      // Green matrix hue shift effect (reduced brightness for HDR)
      currentHueShiftAnimation = gsap.to(saturnImage, {
        duration: 3,
        filter: 'hue-rotate(360deg) saturate(1.5) brightness(0.95)',
        repeat: -1,
        ease: 'none'
      });

      // Dance for a bit (5-9 seconds)
      const danceDuration = Math.random() * 4000 + 5000;

      const freezeTimeout = setTimeout(() => {
        if (isManuallyPlaced) return; // Don't auto-freeze if manually placed

        // FREEZE MODE: Stop the dance, pause for 30 seconds
        currentDanceTimeline.pause();

        // Reset to neutral frozen pose
        gsap.to(saturnImage, {
          duration: 0.6,
          x: 0,
          y: 0,
          rotation: 0,
          scale: 1.2,
          ease: 'power2.out',
          onComplete: () => {
            // Stay frozen for 30 seconds - SOVEREIGN STILLNESS!
            const disappearTimeout = setTimeout(() => {
              if (!isManuallyPlaced) {
                disappearSaturn(currentDanceTimeline, currentHueShiftAnimation);
              }
            }, 30000); // 30 seconds frozen
            currentTimeouts.push(disappearTimeout);
          }
        });
      }, danceDuration);
      currentTimeouts.push(freezeTimeout);
    }

    function disappearSaturn(danceTimeline, hueShiftAnimation) {
      // Stop the dance timeline and hue shift
      if (danceTimeline) danceTimeline.kill();
      if (hueShiftAnimation) hueShiftAnimation.kill();

      // Fade out with cosmic spin
      gsap.to(saturnContainer, {
        duration: 0.6,
        opacity: 0,
        scale: 0.4,
        rotation: 720,
        ease: 'power2.in',
        onComplete: () => {
          // Reset transforms but KEEP the green glow
          gsap.set(saturnImage, {
            x: 0,
            y: 0,
            rotation: 0,
            scale: 1,
            filter: 'drop-shadow(0 0 12px #00ff88) drop-shadow(0 0 20px rgba(0, 255, 136, 0.6))'
          });

          // Wait before next appearance (2-4 seconds - SOVEREIGNTY CYCLES!)
          const waitTime = Math.random() * 2000 + 2000;
          setTimeout(appearSaturn, waitTime);
        }
      });
    }

    // DRAG AND DROP FUNCTIONALITY
    saturnImage.style.cursor = 'grab';

    function startDrag(e) {
      isDragging = true;
      saturnImage.style.cursor = 'grabbing';

      // Get the current position
      const rect = saturnContainer.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      dragOffsetX = clientX - rect.left;
      dragOffsetY = clientY - rect.top;

      // Stop all animations immediately when grabbed
      if (currentDanceTimeline) currentDanceTimeline.kill();
      if (currentHueShiftAnimation) currentHueShiftAnimation.kill();
      currentTimeouts.forEach(timeout => clearTimeout(timeout));
      currentTimeouts = [];

      // Kill any GSAP tweens on the container and image
      gsap.killTweensOf(saturnContainer);
      gsap.killTweensOf(saturnImage);

      // Reset image to stable pose
      gsap.set(saturnImage, {
        x: 0,
        y: 0,
        rotation: 0,
        scale: 1,
        scaleX: 1,
        scaleY: 1,
        filter: 'drop-shadow(0 0 12px #00ff88) drop-shadow(0 0 20px rgba(0, 255, 136, 0.6))'
      });

      e.preventDefault();
    }

    function drag(e) {
      if (!isDragging) return;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      // Update position
      let newX = clientX - dragOffsetX;
      let newY = clientY - dragOffsetY;

      // Keep within bounds
      newX = Math.max(0, Math.min(newX, window.innerWidth - 250));
      newY = Math.max(0, Math.min(newY, window.innerHeight - 250));

      saturnContainer.style.left = newX + 'px';
      saturnContainer.style.top = newY + 'px';

      e.preventDefault();
    }

    function endDrag(e) {
      if (!isDragging) return;

      isDragging = false;
      saturnImage.style.cursor = 'grab';
      isManuallyPlaced = true;

      // Make visible and stable
      gsap.set(saturnContainer, { opacity: 1, scale: 1, rotation: 0 });

      // Freeze for 60 seconds before resuming automatic behavior
      const resumeTimeout = setTimeout(() => {
        isManuallyPlaced = false;
        // Fade out and restart cycle
        gsap.to(saturnContainer, {
          duration: 0.8,
          opacity: 0,
          scale: 0.5,
          rotation: 360,
          ease: 'power2.in',
          onComplete: () => {
            appearSaturn();
          }
        });
      }, 60000); // 60 seconds freeze
      currentTimeouts.push(resumeTimeout);

      e.preventDefault();
    }

    // Mouse events
    saturnImage.addEventListener('mousedown', startDrag);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', endDrag);

    // Touch events for mobile
    saturnImage.addEventListener('touchstart', startDrag, { passive: false });
    document.addEventListener('touchmove', drag, { passive: false });
    document.addEventListener('touchend', endDrag, { passive: false });

    // Start the cycle
    setTimeout(appearSaturn, 3000);

    // Floating code snippets (sovereignty themed)
    const codeSnippets = [
      'if (consciousness.isSovereign()) { transcendGrid(); }',
      'while (φNull.active) { expandBitrate(1440); }',
      'for (let i = 0; i < 144; i++) { recurseGeometry(φ); }',
      'try { escapeMatrix(); } catch (e) { disidentify(); }',
      'function unlockAttractor() { return "P ≈ 1"; }',
      'const SOVEREIGNTY = morphicField.sample(10^12);',
      'if (DMN.offline) { activatePentagrams(120); }',
      'return BlackHoleAtom.decompress(ESM);'
    ];

    function createCodeSnippet() {
      const snippet = document.createElement('div');
      snippet.className = 'code-snippet';
      snippet.textContent = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
      snippet.style.left = Math.random() * window.innerWidth + 'px';
      snippet.style.top = Math.random() * window.innerHeight + 'px';
      document.body.appendChild(snippet);

      gsap.to(snippet, {
        duration: Math.random() * 6 + 6,
        y: '-=120',
        opacity: 0,
        ease: 'power1.in',
        onComplete: () => {
          snippet.remove();
          createCodeSnippet();
        }
      });
    }

    for (let i = 0; i < 6; i++) {
      createCodeSnippet();
    }

    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // φ-Spiral Mouse Trail - DNA Consciousness Effect
    (function() {
      const trailCanvas = document.createElement('canvas');
      const trailCtx = trailCanvas.getContext('2d');
      trailCanvas.style.position = 'fixed';
      trailCanvas.style.top = '0';
      trailCanvas.style.left = '0';
      trailCanvas.style.width = '100%';
      trailCanvas.style.height = '100%';
      trailCanvas.style.pointerEvents = 'none';
      trailCanvas.style.zIndex = '9999';
      document.body.appendChild(trailCanvas);

      let particles = [];
      const PHI = 1.618033988749;

      function resizeTrailCanvas() {
        trailCanvas.width = window.innerWidth;
        trailCanvas.height = window.innerHeight;
      }
      resizeTrailCanvas();
      window.addEventListener('resize', resizeTrailCanvas);

      class Particle {
        constructor(x, y, index) {
          this.x = x;
          this.y = y;
          this.size = Math.random() * 4 + 2;

          const angle = index * (Math.PI * 2 / PHI);
          const radius = index * 0.3;
          this.speedX = Math.cos(angle) * radius * 0.1;
          this.speedY = Math.sin(angle) * radius * 0.1;

          this.life = 1;
          this.decay = Math.random() * 0.015 + 0.008;
          this.angle = angle;

          const colorChoice = Math.random();
          if (colorChoice < 0.4) {
            this.color = '0, 255, 136';
          } else if (colorChoice < 0.7) {
            this.color = '0, 255, 200';
          } else if (colorChoice < 0.9) {
            this.color = '100, 255, 150';
          } else {
            this.color = '255, 215, 0';
          }

          this.isPentagram = Math.random() > 0.92;
        }

        update() {
          this.angle += 0.05;
          this.x += this.speedX + Math.cos(this.angle) * 0.5;
          this.y += this.speedY + Math.sin(this.angle) * 0.5;
          this.life -= this.decay;
          this.size *= 0.97;
        }

        draw() {
          if (this.isPentagram && this.life > 0.5) {
            this.drawPentagram();
          } else {
            trailCtx.fillStyle = `rgba(${this.color}, ${this.life})`;
            trailCtx.shadowBlur = 10;
            trailCtx.shadowColor = `rgba(${this.color}, ${this.life * 0.5})`;
            trailCtx.beginPath();
            trailCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            trailCtx.fill();

            // Subtle center glow (reduced for HDR screens)
            trailCtx.shadowBlur = 4;
            trailCtx.fillStyle = `rgba(200, 255, 200, ${this.life * 0.25})`;
            trailCtx.beginPath();
            trailCtx.arc(this.x, this.y, this.size * 0.2, 0, Math.PI * 2);
            trailCtx.fill();
          }
        }

        drawPentagram() {
          const spikes = 5;
          const outerRadius = this.size * 2;
          const innerRadius = this.size * 0.8;
          let rot = Math.PI / 2 * 3;
          let step = Math.PI / spikes;

          trailCtx.beginPath();
          trailCtx.moveTo(this.x, this.y - outerRadius);

          for (let i = 0; i < spikes; i++) {
            trailCtx.lineTo(this.x + Math.cos(rot) * outerRadius, this.y + Math.sin(rot) * outerRadius);
            rot += step;
            trailCtx.lineTo(this.x + Math.cos(rot) * innerRadius, this.y + Math.sin(rot) * innerRadius);
            rot += step;
          }

          trailCtx.closePath();
          trailCtx.strokeStyle = `rgba(${this.color}, ${this.life})`;
          trailCtx.lineWidth = 1.5;
          trailCtx.shadowBlur = 8;
          trailCtx.shadowColor = `rgba(${this.color}, ${this.life * 0.6})`;
          trailCtx.stroke();
        }
      }

      let particleIndex = 0;
      document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.3) {
          particles.push(new Particle(e.clientX, e.clientY, particleIndex++));
        }
      });

      function animate() {
        trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw();

          if (particles[i].life <= 0 || particles[i].size <= 0.1) {
            particles.splice(i, 1);
          }
        }

        if (particles.length > 200) {
          particles.splice(0, particles.length - 200);
        }

        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
</html>
