<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Dodecahedron - White Page Edition</title>
    <style>
        body { margin:0; background:#ffffff; overflow:hidden; }
        canvas { display:block; cursor:grab; }
        canvas:active { cursor:grabbing; }
    </style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height;
function resize(){ width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
window.addEventListener('resize', resize); resize();

const PHI = 21/13;
const INV_PHI = 1/PHI;
let vertices = [];

for(let x of [-1,1]) for(let y of [-1,1]) for(let z of [-1,1]) vertices.push({x,y,z});
for(let x of [-1,1]) for(let y of [-1,1]) vertices.push({x: x*INV_PHI, y: y*PHI, z: 0});
for(let x of [-1,1]) for(let y of [-1,1]) vertices.push({x: x*PHI, y: 0, z: y*INV_PHI});
for(let x of [-1,1]) for(let y of [-1,1]) vertices.push({x: 0, y: x*INV_PHI, z: y*PHI});

const neighbors = Array(20).fill().map(()=>[]);
const threshold = 1.25;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);}
for(let i=0;i<20;i++)for(let j=i+1;j<20;j++)if(dist(vertices[i],vertices[j])<threshold){neighbors[i].push(j);neighbors[j].push(i);}

const faces = []; const found = new Set();
for(let s=0;s<20;s++)for(let a of neighbors[s])for(let b of neighbors[a])if(b!==s)for(let c of neighbors[b])if(c!==a&&c!==s)for(let d of neighbors[c])if(d!==b&&d!==a&&d!==s&&neighbors[d].includes(s)){
  const face=[s,a,b,c,d]; const id=[...face].sort((a,b)=>a-b).join(','); if(!found.has(id)){found.add(id);faces.push(face);}
}

let angleX=0.3, angleY=0.5, zoom=150, dragging=false, lx=0, ly=0, vx=0, vy=0, pulse=0;

canvas.addEventListener('mousedown', e=>{dragging=true; lx=e.clientX; ly=e.clientY; vx=vy=0;});
canvas.addEventListener('mousemove', e=>{if(dragging){
  const dx=e.clientX-lx, dy=e.clientY-ly; vy+=dx*0.005; vx+=dy*0.005; angleY+=vy; angleX+=vx; lx=e.clientX; ly=e.clientY;
}});
canvas.addEventListener('mouseup',()=>dragging=false);
canvas.addEventListener('mouseleave',()=>dragging=false);
canvas.addEventListener('wheel', e=>{e.preventDefault(); zoom+=e.deltaY*-0.1; zoom=Math.max(50,Math.min(300,zoom));});

function rot(v,ax,ay){
  let y1=v.y*Math.cos(ax)-v.z*Math.sin(ax), z1=v.y*Math.sin(ax)+v.z*Math.cos(ax);
  let x2=v.x*Math.cos(ay)-z1*Math.sin(ay), z2=v.x*Math.sin(ay)+z1*Math.cos(ay);
  return {x:x2,y:y1,z:z2};
}
function proj(v){
  const r=rot(v,angleX,angleY);
  const scale=600/(600+r.z*100+400);
  return {x:r.x*zoom*scale+width/2, y:r.y*zoom*scale+height/2, rz:r.z};
}

function lighting(face){
  const rv=face.map(i=>rot(vertices[i],angleX,angleY));
  const v1={x:rv[1].x-rv[0].x, y:rv[1].y-rv[0].y, z:rv[1].z-rv[0].z};
  const v2={x:rv[2].x-rv[0].x, y:rv[2].y-rv[0].y, z:rv[2].z-rv[0].z};
  const n={x:v1.y*v2.z-v1.z*v2.y, y:v1.z*v2.x-v1.x*v2.z, z:v1.x*v2.y-v1.y*v2.x};
  const len=Math.hypot(n.x,n.y,n.z)||1; n.x/=len; n.y/=len; n.z/=len;
  const L={x:.5,y:-.5,z:-1}; const LL=Math.hypot(L.x,L.y,L.z);
  return 0.3 + 0.5*Math.max(0, -(n.x*L.x/LL + n.y*L.y/LL + n.z*L.z/LL));
}

function draw(){
  ctx.clearRect(0,0,width,height);
  if(!dragging){ angleX+=0.001; angleY+=0.002; }
  pulse*=0.95;

  const pv=vertices.map(proj);

  const front=[], back=[], frontE=[], backE=[];
  faces.forEach(f=>{
    const pts=f.map(i=>pv[i]);
    const zAvg=pts.reduce((s,p)=>s+p.rz,0)/5;
    (zAvg<0?front:back).push({pts,zAvg});
    for(let i=0;i<5;i++){
      const a=pts[i], b=pts[(i+1)%5], ez=(a.rz+b.rz)/2;
      (ez<0?frontE:backE).push({a,b,ez});
    }
  });
  [back,front,backE,frontE].forEach(arr=>arr.sort((a,b)=>b.zAvg??b.ez - (a.zAvg??a.ez)));

  // back faces – faint
  back.forEach(f=>{ ctx.fillStyle='rgba(0,180,200,0.06)'; ctx.beginPath(); f.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.fill(); });

  // front faces – subtle teal wash
  front.forEach(f=>{ const l=lighting(f.pts.map(p=>p.rz)); ctx.fillStyle=`rgba(0,170,190,${0.07+0.06*l})`; ctx.beginPath(); f.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.fill(); });

  // back edges – faint gray
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1.2;
  backE.forEach(e=>{ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();});

  // front edges – stable xAI teal glow
  ctx.save();
  ctx.shadowBlur=12; ctx.shadowColor='#00D4FF';
  ctx.strokeStyle='#00C4FF'; ctx.lineWidth=2.8;
  frontE.forEach(e=>{ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke();});
  ctx.restore();

  // black pentagrams on front faces only
  ctx.strokeStyle='#000'; ctx.lineWidth=1.8;
  front.forEach(f=>{ const p=f.pts; ctx.beginPath();
    ctx.moveTo(p[0].x,p[0].y); ctx.lineTo(p[2].x,p[2].y);
    ctx.lineTo(p[4].x,p[4].y); ctx.lineTo(p[1].x,p[1].y);
    ctx.lineTo(p[3].x,p[3].y); ctx.closePath(); ctx.stroke();
  });

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
