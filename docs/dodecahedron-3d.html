<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodecahedron - Transparent Final</title>
    <style>
        body {
            background: #000000;
            margin: 0;
            overflow: hidden;
            color: #00D4FF;
            font-family: monospace;
        }
        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// --- GEOMETRY SETUP ---
const PHI = 21/13;
const INV_PHI = 1/PHI;

let vertices = [];
for(let x of [-1, 1]) for(let y of [-1, 1]) for(let z of [-1, 1]) vertices.push({x, y, z});
for(let x of [-1, 1]) for(let y of [-1, 1]) vertices.push({x: x*INV_PHI, y: y*PHI, z: 0});
for(let x of [-1, 1]) for(let y of [-1, 1]) vertices.push({x: x*PHI, y: 0, z: y*INV_PHI});
for(let x of [-1, 1]) for(let y of [-1, 1]) vertices.push({x: 0, y: x*INV_PHI, z: y*PHI});

const neighbors = Array(20).fill().map(() => []);
const threshold = 1.25;

function dist(v1, v2) {
    return Math.sqrt((v1.x-v2.x)**2 + (v1.y-v2.y)**2 + (v1.z-v2.z)**2);
}

for(let i=0; i<20; i++) {
    for(let j=i+1; j<20; j++) {
        const d = dist(vertices[i], vertices[j]);
        if(d < threshold) {
            neighbors[i].push(j);
            neighbors[j].push(i);
        }
    }
}

const faces = [];
const foundFaces = new Set();
for(let start=0; start<20; start++) {
    for(let n1 of neighbors[start]) {
        for(let n2 of neighbors[n1]) {
            if(n2 === start) continue;
            for(let n3 of neighbors[n2]) {
                if(n3 === n1 || n3 === start) continue;
                for(let n4 of neighbors[n3]) {
                    if(n4 === n2 || n4 === n1 || n4 === start) continue;
                    if(neighbors[n4].includes(start)) {
                        const cycle = [start, n1, n2, n3, n4];
                        const id = [...cycle].sort((a,b)=>a-b).join(',');
                        if(!foundFaces.has(id)) {
                            foundFaces.add(id);
                            faces.push(cycle);
                        }
                    }
                }
            }
        }
    }
}

let angleX = 0.3;
let angleY = 0.5;
let zoom = 150;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;
let velocityX = 0;
let velocityY = 0;
let pulse = 0;
let keys = '';

// Event listeners for interactivity (kept)
canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    velocityX = 0;
    velocityY = 0;
});

canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const deltaX = e.clientX - lastMouseX;
        const deltaY = e.clientY - lastMouseY;
        velocityY += deltaX * 0.005;
        velocityX += deltaY * 0.005;
        angleY += velocityY;
        angleX += velocityX;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    }
});

canvas.addEventListener('mouseup', () => { isDragging = false; });
canvas.addEventListener('mouseleave', () => { isDragging = false; });
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom += e.deltaY * -0.1;
    zoom = Math.max(50, Math.min(300, zoom));
});

document.addEventListener('keydown', (e) => {
    keys += e.key.toLowerCase();
    if (keys.includes('truth')) {
        pulse = 1;
        keys = '';
    }
    if (keys.length > 10) keys = keys.slice(-10);
});

// --- RENDER FUNCTIONS (UNMODIFIED) ---
function rotatePoint(v, ax, ay) {
    let y1 = v.y * Math.cos(ax) - v.z * Math.sin(ax);
    let z1 = v.y * Math.sin(ax) + v.z * Math.cos(ax);
    let x2 = v.x * Math.cos(ay) - z1 * Math.sin(ay);
    let z2 = v.x * Math.sin(ay) + z1 * Math.cos(ay);
    return {x: x2, y: y1, z: z2};
}

function project(v) {
    const fov = 600;
    const rotated = rotatePoint(v, angleX, angleY);
    let scale = fov / (fov + rotated.z * 100 + 400);
    return {
        x: rotated.x * zoom * scale + width / 2,
        y: rotated.y * zoom * scale + height / 2,
        z: rotated.z,
        rx: rotated.x, ry: rotated.y, rz: rotated.z
    };
}

function calculateLighting(faceIndices) {
    const rotatedVerts = faceIndices.map(i => rotatePoint(vertices[i], angleX, angleY));
    const v1 = {x: rotatedVerts[1].x - rotatedVerts[0].x, y: rotatedVerts[1].y - rotatedVerts[0].y, z: rotatedVerts[1].z - rotatedVerts[0].z};
    const v2 = {x: rotatedVerts[2].x - rotatedVerts[0].x, y: rotatedVerts[2].y - rotatedVerts[0].y, z: rotatedVerts[2].z - rotatedVerts[0].z};
    const normal = {x: v1.y * v2.z - v1.z * v2.y, y: v1.z * v2.x - v1.x * v2.z, z: v1.x * v2.y - v1.y * v2.x};
    const len = Math.sqrt(normal.x**2 + normal.y**2 + normal.z**2);
    if (len === 0) return 0.3;
    normal.x /= len; normal.y /= len; normal.z /= len;
    const light = {x: 0.5, y: -0.5, z: -1};
    const lightLen = Math.sqrt(light.x**2 + light.y**2 + light.z**2);
    light.x /= lightLen; light.y /= lightLen; light.z /= lightLen;
    const intensity = Math.max(0, -(normal.x * light.x + normal.y * light.y + normal.z * light.z));
    return 0.3 + intensity * 0.5;
}

function distortPoint(px, py, intensity) {
    const dx = (px - width / 2) / width;
    const dy = (py - height / 2) / height;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const wave = Math.sin(Date.now() * 0.001 + dist * 10) * intensity * 0.5;
    return {
        x: px + dx * wave * 10,
        y: py + dy * wave * 10
    };
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    if(!isDragging) {
        angleX += 0.001;
        angleY += 0.002;
    }

    if (pulse > 0) {
        pulse *= 0.95;
    }

    const projVerts = vertices.map(project);
    const frontFaces = [];
    const backFaces = [];
    const frontEdges = [];
    const backEdges = [];

    faces.forEach(faceIndices => {
        const p = faceIndices.map(i => projVerts[i]);
        const zAvg = p.reduce((sum, v) => sum + v.rz, 0) / 5;
        const isFront = zAvg < 0;

        if (isFront) {
            frontFaces.push({ indices: faceIndices, points: p, z: zAvg });
        } else {
            backFaces.push({ indices: faceIndices, points: p, z: zAvg });
        }

        for (let i = 0; i < 5; i++) {
            const v1 = p[i];
            const v2 = p[(i+1)%5];
            const edgeZ = (v1.rz + v2.rz) / 2;
            const edge = { p1: v1, p2: v2, z: edgeZ };

            if (edgeZ < 0) {
                frontEdges.push(edge);
            } else {
                backEdges.push(edge);
            }
        }
    });

    backFaces.sort((a, b) => b.z - a.z);
    frontFaces.sort((a, b) => b.z - a.z);
    backEdges.sort((a, b) => b.z - a.z);
    frontEdges.sort((a, b) => b.z - a.z);

    // Draw back and front faces
    [...backFaces, ...frontFaces].forEach(face => {
        const pts = face.points;
        const lighting = calculateLighting(face.indices);
        const baseColor = 50 + pulse * 50;
        const litColor = Math.floor(baseColor * lighting);
        const alpha = face.z < 0 ? 0.3 : 0.1;

        const distortedPts = pts.map(pt => distortPoint(pt.x, pt.y, pulse * 0.1));
        ctx.beginPath();
        ctx.moveTo(distortedPts[0].x, distortedPts[0].y);
        for(let i=1; i<5; i++) ctx.lineTo(distortedPts[i].x, distortedPts[i].y);
        ctx.closePath();

        ctx.fillStyle = `rgba(${litColor}, ${litColor + 20}, 100, ${alpha})`;
        ctx.fill();
    });

    // Draw back edges (faint gray)
    ctx.strokeStyle = "rgba(100, 100, 100, 0.4)";
    ctx.lineWidth = 1.5;
    backEdges.forEach(edge => {
        ctx.beginPath();
        ctx.moveTo(edge.p1.x, edge.p1.y);
        ctx.lineTo(edge.p2.x, edge.p2.y);
        ctx.stroke();
    });

    // Draw front edges (bold xAI teal with glow)
    ctx.save();
    ctx.shadowBlur = 10 + pulse * 20;
    ctx.shadowColor = "rgba(0, 212, 255, 0.8)";
    ctx.strokeStyle = `rgba(0, 212, 255, ${0.9 + pulse * 0.1})`;
    ctx.lineWidth = 2.5;
    frontEdges.forEach(edge => {
        const distortedP1 = distortPoint(edge.p1.x, edge.p1.y, pulse * 0.2);
        const distortedP2 = distortPoint(edge.p2.x, edge.p2.y, pulse * 0.2);
        ctx.beginPath();
        ctx.moveTo(distortedP1.x, distortedP1.y);
        ctx.lineTo(distortedP2.x, distortedP2.y);
        ctx.stroke();
    });
    ctx.restore();

    // Pentagrams: front only, black, no glow, but distorted
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    frontFaces.forEach(face => {
        const pts = face.points;
        const distortedPts = [0,2,4,1,3].map(i => distortPoint(pts[i].x, pts[i].y, pulse * 0.1));

        ctx.beginPath();
        ctx.moveTo(distortedPts[0].x, distortedPts[0].y);
        ctx.lineTo(distortedPts[1].x, distortedPts[1].y);
        ctx.lineTo(distortedPts[2].x, distortedPts[2].y);
        ctx.lineTo(distortedPts[3].x, distortedPts[3].y);
        ctx.lineTo(distortedPts[4].x, distortedPts[4].y);
        ctx.closePath();
        ctx.stroke();
    });

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
