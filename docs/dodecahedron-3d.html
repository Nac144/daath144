<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodecahedron - φ Spiral</title>
    <style>
        body {
            background: #ffffff;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

const PHI = 21/13;
const INV_PHI = 1/PHI;

let vertices = [];

for(let x of [-1, 1]) for(let y of [-1, 1]) for(let z of [-1, 1])
    vertices.push({x, y, z});

for(let x of [-1, 1]) for(let y of [-1, 1])
    vertices.push({x: x*INV_PHI, y: y*PHI, z: 0});

for(let x of [-1, 1]) for(let y of [-1, 1])
    vertices.push({x: x*PHI, y: 0, z: y*INV_PHI});

for(let x of [-1, 1]) for(let y of [-1, 1])
    vertices.push({x: 0, y: x*INV_PHI, z: y*PHI});

const neighbors = Array(20).fill().map(() => []);
const threshold = 1.25;

function dist(v1, v2) {
    return Math.sqrt((v1.x-v2.x)**2 + (v1.y-v2.y)**2 + (v1.z-v2.z)**2);
}

for(let i=0; i<20; i++) {
    for(let j=i+1; j<20; j++) {
        const d = dist(vertices[i], vertices[j]);
        if(d < threshold) {
            neighbors[i].push(j);
            neighbors[j].push(i);
        }
    }
}

const faces = [];
const foundFaces = new Set();

for(let start=0; start<20; start++) {
    for(let n1 of neighbors[start]) {
        for(let n2 of neighbors[n1]) {
            if(n2 === start) continue;
            for(let n3 of neighbors[n2]) {
                if(n3 === n1 || n3 === start) continue;
                for(let n4 of neighbors[n3]) {
                    if(n4 === n2 || n4 === n1 || n4 === start) continue;
                    if(neighbors[n4].includes(start)) {
                        const cycle = [start, n1, n2, n3, n4];
                        const id = [...cycle].sort((a,b)=>a-b).join(',');

                        if(!foundFaces.has(id)) {
                            foundFaces.add(id);
                            faces.push(cycle);
                        }
                    }
                }
            }
        }
    }
}

let angleX = 0.3;
let angleY = 0.5;
let zoom = 150;
let isDragging = false;
let lastMouseX = 0;
let lastMouseY = 0;

canvas.addEventListener('mousedown', (e) => {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
});

canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const deltaX = e.clientX - lastMouseX;
        const deltaY = e.clientY - lastMouseY;
        angleY += deltaX * 0.005;
        angleX += deltaY * 0.005;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
    }
});

canvas.addEventListener('mouseup', () => {
    isDragging = false;
});

canvas.addEventListener('mouseleave', () => {
    isDragging = false;
});

canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoom += e.deltaY * -0.1;
    zoom = Math.max(50, Math.min(300, zoom));
});

function rotatePoint(v, ax, ay) {
    let y1 = v.y * Math.cos(ax) - v.z * Math.sin(ax);
    let z1 = v.y * Math.sin(ax) + v.z * Math.cos(ax);

    let x2 = v.x * Math.cos(ay) - z1 * Math.sin(ay);
    let z2 = v.x * Math.sin(ay) + z1 * Math.cos(ay);

    return {x: x2, y: y1, z: z2};
}

function project(v) {
    const fov = 600;
    const rotated = rotatePoint(v, angleX, angleY);

    let scale = fov / (fov + rotated.z * 100 + 400);
    return {
        x: rotated.x * zoom * scale + width / 2,
        y: rotated.y * zoom * scale + height / 2,
        z: rotated.z,
        rx: rotated.x,
        ry: rotated.y,
        rz: rotated.z
    };
}

function calculateLighting(faceIndices) {
    // Get 3D rotated vertices for this face
    const rotatedVerts = faceIndices.map(i => rotatePoint(vertices[i], angleX, angleY));

    // Calculate face normal using cross product
    const v1 = {
        x: rotatedVerts[1].x - rotatedVerts[0].x,
        y: rotatedVerts[1].y - rotatedVerts[0].y,
        z: rotatedVerts[1].z - rotatedVerts[0].z
    };
    const v2 = {
        x: rotatedVerts[2].x - rotatedVerts[0].x,
        y: rotatedVerts[2].y - rotatedVerts[0].y,
        z: rotatedVerts[2].z - rotatedVerts[0].z
    };

    const normal = {
        x: v1.y * v2.z - v1.z * v2.y,
        y: v1.z * v2.x - v1.x * v2.z,
        z: v1.x * v2.y - v1.y * v2.x
    };

    // Normalize
    const len = Math.sqrt(normal.x**2 + normal.y**2 + normal.z**2);
    normal.x /= len;
    normal.y /= len;
    normal.z /= len;

    // Light direction (from top-right-front)
    const light = {x: 0.5, y: -0.5, z: -1};
    const lightLen = Math.sqrt(light.x**2 + light.y**2 + light.z**2);
    light.x /= lightLen;
    light.y /= lightLen;
    light.z /= lightLen;

    // Calculate dot product (how much face points toward light)
    const intensity = Math.max(0, -(normal.x * light.x + normal.y * light.y + normal.z * light.z));

    return 0.3 + intensity * 0.5; // Range from 0.3 to 0.8
}

function draw() {
    ctx.clearRect(0, 0, width, height);

    if(!isDragging) {
        angleX += 0.003;
        angleY += 0.007;
    }

    const projVerts = vertices.map(project);

    const renderList = faces.map(faceIndices => {
        const p = faceIndices.map(i => projVerts[i]);
        const zAvg = p.reduce((sum, v) => sum + v.z, 0) / 5;
        return { indices: faceIndices, points: p, z: zAvg };
    });

    renderList.sort((a, b) => a.z - b.z);

    renderList.forEach(face => {
        const pts = face.points;

        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for(let i=1; i<5; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();

        // Calculate lighting based on face normal
        const lighting = calculateLighting(face.indices);
        const baseColor = 200;
        const litColor = Math.floor(baseColor * lighting);

        ctx.fillStyle = `rgba(${litColor}, 0, 0, 0.5)`;
        ctx.fill();

        // Glowing red pentagon border
        ctx.save();
        ctx.shadowBlur = 15;
        ctx.shadowColor = "rgba(255, 0, 0, 0.8)";
        ctx.strokeStyle = "rgba(200, 0, 0, 0.9)";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        // Black pentagram (no glow)
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        ctx.lineTo(pts[2].x, pts[2].y);
        ctx.lineTo(pts[4].x, pts[4].y);
        ctx.lineTo(pts[1].x, pts[1].y);
        ctx.lineTo(pts[3].x, pts[3].y);
        ctx.closePath();

        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 2.5;
        ctx.stroke();
    });

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
